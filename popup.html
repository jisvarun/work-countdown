<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Work Countdown</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-1: #38bdf8;
      --accent-2: #818cf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px 16px;
      background: var(--bg-gradient);
      color: var(--text-main);
      overflow-x: hidden;
      position: relative;
    }

    /* Dynamic Background Boxes */
    .bg-boxes-container {
      position: fixed;
      inset: 0;
      display: grid;
      gap: 8px;
      padding: 8px;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .bg-box {
      min-width: 0;
      min-height: 0;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.025);
      transition: background-color 500ms ease, border-color 500ms ease, box-shadow 500ms ease;
    }

    .bg-box.is-filled {
      background: var(--progress-color);
      border-color: rgba(255, 255, 255, 0.18);
      box-shadow: 0 0 18px var(--progress-color);
    }

    /* Main Container Content */
    .container {
      position: relative;
      z-index: 1;
      width: min(450px, 100%);
      padding: 24px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 10px;
    }

    header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-1);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    /* Motivation Quote Box */
    .quote-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      padding: 18px 20px;
      border-radius: 16px;
      font-size: 22px;
      line-height: 1.55;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .quote-card span.quote-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    /* Setup Form View */
    .setup-view {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .preset-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 0;
      font-size: 11px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .preset-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--accent-1);
    }

    .datetime-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field-group label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .field-group input {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      outline: none;
      transition: border 0.2s;
    }

    .field-group input:focus {
      border-color: var(--accent-1);
    }

    .action-btn {
      background: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
    }

    .action-btn:hover {
      opacity: 0.9;
    }

    .action-btn:active {
      transform: scale(0.98);
    }

    /* Active Countdown View */
    .countdown-view {
      display: none;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      text-align: center;
      padding-top: 10px;
    }

    .timer-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
    }

    .time-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
      padding: 12px 6px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .time-box .num {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
    }

    .time-box .label {
      font-size: 10px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .btn-secondary {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>

  <!-- Dynamic Background Boxes that shift colors as countdown progresses -->
  <div class="bg-boxes-container" id="bgBoxes" aria-hidden="true"></div>

  <div class="container">
    <header>
      <h1>Work Countdown</h1>
      <div class="status-badge" id="statusBadge">Ready</div>
    </header>

    <!-- Motivational Quote -->
    <div class="quote-card">
      <span class="quote-title">⚡ Focus Fuel</span>
      <p id="quoteText">"Don't waste your time, every second counts towards your future."</p>
    </div>

    <!-- Setup View (Input form) -->
    <div class="setup-view" id="setupView">
      <div class="presets">
        <button class="preset-btn" data-mins="25">25m</button>
        <button class="preset-btn" data-mins="60">1h</button>
        <button class="preset-btn" data-mins="240">4h</button>
        <button class="preset-btn" data-days="1">1d</button>
      </div>

      <div class="datetime-grid">
        <div class="field-group">
          <label>Years</label>
          <input type="number" id="inpYears" value="0" min="0">
        </div>
        <div class="field-group">
          <label>Months</label>
          <input type="number" id="inpMonths" value="0" min="0" max="12">
        </div>
        <div class="field-group">
          <label>Days</label>
          <input type="number" id="inpDays" value="0" min="0" max="31">
        </div>
        <div class="field-group">
          <label>Hours</label>
          <input type="number" id="inpHours" value="1" min="0" max="23">
        </div>
        <div class="field-group">
          <label>Minutes</label>
          <input type="number" id="inpMinutes" value="0" min="0" max="59">
        </div>
        <div class="field-group">
          <label>Seconds</label>
          <input type="number" id="inpSeconds" value="0" min="0" max="59">
        </div>
      </div>

      <button class="action-btn" id="startBtn">Start Countdown</button>
    </div>

    <!-- Active Countdown View -->
    <div class="countdown-view" id="countdownView">
      <div class="timer-grid">
        <div class="time-box">
          <span class="num" id="tYears">00</span>
          <span class="label">Years</span>
        </div>
        <div class="time-box">
          <span class="num" id="tMonths">00</span>
          <span class="label">Months</span>
        </div>
        <div class="time-box">
          <span class="num" id="tDays">00</span>
          <span class="label">Days</span>
        </div>
        <div class="time-box">
          <span class="num" id="tHours">00</span>
          <span class="label">Hours</span>
        </div>
        <div class="time-box">
          <span class="num" id="tMinutes">00</span>
          <span class="label">Mins</span>
        </div>
        <div class="time-box">
          <span class="num" id="tSeconds">00</span>
          <span class="label">Secs</span>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn-secondary" id="pauseBtn">Pause</button>
        <button class="btn-secondary" id="resetBtn">Reset</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
